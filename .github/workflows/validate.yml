name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/go-contract/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned example compiler
        working-directory: examples/typescript-contract
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate skill metadata
        run: python3 scripts/validate_skill.py .
      - name: Run package, tooling, and executable contract checks
        run: python3 scripts/run_local_validation.py
      - name: Exercise diff hygiene on staged changes
        shell: bash
        run: bash scripts/test_review_diff.sh
