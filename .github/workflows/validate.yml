name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill
        run: python3 scripts/validate_skill.py .
      - name: Check diff hygiene script syntax
        run: bash -n scripts/review_diff.sh
